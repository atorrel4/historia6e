
<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missió Història - Edat Antiga</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(180deg,#6B4F2A,#D8B26E);display:flex;justify-content:center;align-items:center;min-height:100vh}
#game{width:95%;max-width:900px;background:white;border-radius:24px;padding:24px;box-shadow:0 15px 35px rgba(0,0,0,.35)}
h1{text-align:center;color:#5A3312}
#top{display:flex;justify-content:space-between;font-size:22px;font-weight:bold}
#progress{height:14px;background:#eee;border-radius:20px;margin:18px 0;overflow:hidden}
#bar{height:100%;width:0;background:#22c55e;transition:.3s}
button{width:100%;padding:15px;margin:8px 0;border:none;border-radius:14px;font-size:20px;cursor:pointer;background:#f3f4f6}
button:hover{background:#FFF4D6}
.correct{background:#22c55e;color:white}.wrong{background:#dc2626;color:white}
#badge{font-size:70px}
.menu{background:#5A3312;color:white}
</style>
</head>
<body>
<div id="game">
<div id="start">
<h1>🏺 Missió Història</h1>
<p style="text-align:center">Repte de l'Edat Antiga · 15 preguntes</p>
<button onclick="startGame()">🚀 Comença</button>
</div>
<div id="quiz" style="display:none">
<div id="top"><div id="score">⭐0</div><div id="timer">⏱️20</div></div>
<div id="progress"><div id="bar"></div></div>
<h2 id="question"></h2>
<div id="answers"></div>
</div>
<div id="end" style="display:none;text-align:center">
<div id="badge"></div>
<h1 id="title"></h1>
<h2 id="finalScore"></h2>
<button onclick="location.reload()">🔁 Tornar a jugar</button>
<button class="menu" onclick="window.location='index.html'">🏺 Tornar al menú</button>
</div>
</div>

<script>
const questions=[
{q:"Quina etapa comença amb la invenció de l'escriptura?",c:"L'Edat Antiga",w:["La Prehistòria","L'Edat Mitjana","L'Edat Moderna"]},
{q:"Quina etapa és anterior a la Història?",c:"La Prehistòria",w:["L'Edat Antiga","L'Edat Moderna","L'Edat Contemporània"]},
{q:"Quin invent marca el començament de la Història?",c:"L'escriptura",w:["La roda","El foc","L'arada"]},
{q:"Fa aproximadament quants anys va aparèixer l'escriptura?",c:"Fa uns 5.000 anys",w:["Fa 500 anys","Fa 50.000 anys","Fa 1.000 anys"]},
{q:"On van aparèixer les primeres civilitzacions?",c:"Prop dels grans rius",w:["A les muntanyes","Al desert","A les illes"]},
{q:"Per què els rius eren importants?",c:"Perquè permetien cultivar",w:["Perquè eren més freds","Perquè hi havia castells","Perquè hi havia volcans"]},
{q:"Quina va ser una de les primeres civilitzacions?",c:"Els sumeris",w:["Els romans","Els víkings","Els asteques"]},
{q:"Quina altra gran civilització estudiem després?",c:"Els egipcis",w:["Els inuit","Els maies","Els normands"]},
{q:"Quin continent acull Egipte?",c:"Àfrica",w:["Europa","Àsia","Oceania"]},
{q:"Quin riu és famós a Egipte?",c:"El Nil",w:["L'Ebre","El Tajo","El Danubi"]},
{q:"Els ibers vivien a...",c:"La península Ibèrica",w:["Amèrica","Austràlia","Xina"]},
{q:"Els celtes vivien sobretot...",c:"Al nord i a l'oest",w:["Al desert","A Egipte","A Grècia"]},
{q:"Què estudia la Història?",c:"El passat de les persones",w:["Només els animals","Només els rius","Només les plantes"]},
{q:"Com es transmetia molta informació abans d'escriure?",c:"Oralment",w:["Per internet","Per televisió","Per correu electrònic"]},
{q:"Quin serà el següent gran repte després d'aquest?",c:"Els Sumeris",w:["Els Romans","Els Celtes","Els Vikings"]}
];

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;}
let order=shuffle(questions),i=0,p=0,ok=0,t=20,intv;
function startGame(){start.style.display='none';quiz.style.display='block';nextQ();}
function nextQ(){if(i>=order.length)return finish();bar.style.width=(i/order.length*100)+'%';question.textContent=(i+1)+"/15 · "+order[i].q;score.textContent="⭐ "+p;t=20;timer.textContent="⏱️"+t;clearInterval(intv);intv=setInterval(()=>{t--;timer.textContent="⏱️"+t;if(t<=0){clearInterval(intv);i++;nextQ();}},1000);answers.innerHTML='';shuffle([order[i].c,...order[i].w]).forEach(txt=>{const b=document.createElement('button');b.textContent=txt;b.onclick=()=>answer(txt,b);answers.appendChild(b);});}
function answer(txt,b){clearInterval(intv);[...answers.children].forEach(x=>{x.disabled=true;if(x.textContent===order[i].c)x.classList.add('correct');});if(txt===order[i].c){p+=100+t*5;ok++;}else b.classList.add('wrong');setTimeout(()=>{i++;nextQ();},1200);}
function finish(){quiz.style.display='none';end.style.display='block';badge.textContent=ok===15?"🏆":ok>=12?"🥇":ok>=9?"🥈":"🥉";title.textContent=ok===15?"Guardians de la Història":"Exploradors del Temps";finalScore.textContent=ok+"/15 preguntes · "+p+" punts";}
</script>
</body>
</html>
