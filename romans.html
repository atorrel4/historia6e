<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repte dels Romans</title>

<style>

*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#7A2E2E,#C0392B,#E6C27A);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

#game{
width:95%;
max-width:920px;
background:white;
border-radius:24px;
padding:24px;
box-shadow:0 15px 35px rgba(0,0,0,.35);
}

h1{
text-align:center;
color:#8B0000;
font-size:42px;
margin-bottom:10px;
}

.small{
text-align:center;
color:#666;
}

#top{
display:flex;
justify-content:space-between;
align-items:center;
font-size:22px;
font-weight:bold;
margin-bottom:12px;
}

#progress{
height:14px;
background:#eee;
border-radius:20px;
overflow:hidden;
margin:15px 0;
}

#bar{
height:100%;
width:0%;
background:#22c55e;
transition:.3s;
}

#circle{
width:64px;
height:64px;
border-radius:50%;
border:6px solid #B22222;
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
font-weight:bold;
color:#8B0000;
}

#img{
width:100%;
height:220px;
object-fit:cover;
border-radius:18px;
margin:12px 0;
}

button{
width:100%;
padding:15px;
margin:8px 0;
border:none;
border-radius:14px;
font-size:20px;
cursor:pointer;
background:#f3f4f6;
transition:.2s;
}

button:hover{
background:#FFF2D6;
transform:scale(1.02);
}

.correct{background:#22c55e;color:white;}
.wrong{background:#dc2626;color:white;}

#badge{font-size:82px;}

.menuBtn{
background:#8B0000;
color:white;
}

.menuBtn:hover{
background:#650000;
}

.pop{
animation:pop .4s;
}

@keyframes pop{
0%{transform:scale(.8);}
60%{transform:scale(1.08);}
100%{transform:scale(1);}
}

.confetti{
position:fixed;
width:10px;
height:10px;
top:-20px;
animation:fall 3s linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
}
}

</style>

</head>

<body>

<div id="game">

<div id="start">

<h1>🦅 Repte dels Romans</h1>

<p class="small">
20 preguntes • Coliseu • Gladiadors • Aqüeductes
</p>

<button onclick="startGame()">⚔️ Comença la missió</button>

</div>

<div id="quiz" style="display:none;">

<div id="top">

<div id="score">⭐0</div>

<div id="circle">
<span id="timer">20</span>
</div>

</div>

<div id="progress">
<div id="bar"></div>
</div>

<img id="img" src="https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80">

<h2 id="question"></h2>

<div id="answers"></div>

</div>

<div id="end" style="display:none;text-align:center;">

<div id="badge"></div>

<h1 id="title"></h1>

<h2 id="finalScore"></h2>

<p id="summary"></p>

<button onclick="location.reload()">🔁 Tornar a jugar</button>

<button class="menuBtn" onclick="window.location='index.html'">
🏺 Tornar al menú
</button>

</div>

</div>

<script>

const questions=[

{q:"Quina ciutat era la capital de l'Imperi Romà?",c:"Roma",w:["Atenes","Esparta","Cartago"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"},

{q:"Com s'anomenaven els soldats romans?",c:"Legionaris",w:["Hoplites","Gladiadors","Druides"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"},

{q:"Què era una legió?",c:"Un grup de soldats romans",w:["Un temple","Una ciutat","Un mercat"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"},

{q:"Quin edifici és el més famós de Roma?",c:"El Coliseu",w:["El Partenó","La Piràmide","El Ziggurat"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"},

{q:"Qui lluitava al Coliseu?",c:"Els gladiadors",w:["Els filòsofs","Els pagesos","Els druides"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"},

{q:"Per a què servien els aqüeductes?",c:"Per portar aigua",w:["Per fer carreteres","Per guardar menjar","Per construir muralles"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"},

{q:"Per què eren famoses les carreteres romanes?",c:"Perquè unien moltes ciutats",w:["Perquè eren de fusta","Perquè flotaven","Perquè eren subterrànies"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"},

{q:"Quin idioma parlaven els romans?",c:"Llatí",w:["Grec","Hebreu","Àrab"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"},

{q:"Qui era el màxim governant de l'imperi?",c:"L'emperador",w:["El faraó","El cònsol grec","El druida"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"},

{q:"Quin poble va influir molt en els romans?",c:"Els grecs",w:["Els víkings","Els asteques","Els maies"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"},

{q:"Què construïen als pobles i ciutats?",c:"Termes",w:["Ziggurats","Castres","Piràmides"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"},

{q:"Per a què servien les termes?",c:"Per banyar-se",w:["Per guardar cereals","Per fer guerres","Per estudiar"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"},

{q:"Com s'anomenava la plaça principal d'una ciutat romana?",c:"Fòrum",w:["Àgora","Temple","Castre"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"},

{q:"Què feien al fòrum?",c:"Comerciar i reunir-se",w:["Només lluitar","Només dormir","Només estudiar"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"},

{q:"Com s'anomenava el gran imperi creat pels romans?",c:"Imperi Romà",w:["Imperi Grec","Imperi Egipci","Imperi Celta"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"},

{q:"Quina forma de govern hi havia abans dels emperadors?",c:"República",w:["Monarquia absoluta","Democràcia grega","Castre"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"},

{q:"Què portaven els legionaris per protegir-se?",c:"Escut i casc",w:["Arc i fletxes","Llança de fusta","Vestit de cuir"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"},

{q:"Els romans van construir molts...",c:"Ponts",w:["Castells medievals","Gratacels","Molins de vent"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"},

{q:"Què era un amfiteatre?",c:"Un edifici per als espectacles",w:["Un temple","Una escola","Un mercat"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"},

{q:"Quina és una gran herència dels romans?",c:"Les carreteres, els ponts i el dret",w:["Les piràmides","Els ziggurats","Els druides"],img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=900&q=80"}

];

function shuffle(a){
a=[...a];
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

let ordre=shuffle(questions);

let i=0,punts=0,encerts=0,temps=20,interval;

function startGame(){
start.style.display="none";
quiz.style.display="block";
nextQ();
}

function nextQ(){

if(i>=ordre.length){
finish();
return;
}

bar.style.width=(i/20*100)+"%";

question.innerHTML=(i+1)+"/20 · "+ordre[i].q;

img.src=ordre[i].img;

score.innerHTML="⭐ "+punts;

temps=20;

timer.innerHTML=temps;

clearInterval(interval);

interval=setInterval(()=>{

temps--;

timer.innerHTML=temps;

if(temps<=0){
clearInterval(interval);
i++;
nextQ();
}

},1000);

answers.innerHTML="";

shuffle([ordre[i].c,...ordre[i].w]).forEach(t=>{

const b=document.createElement("button");

b.innerHTML=t;

b.onclick=()=>answer(t,b);

answers.appendChild(b);

});

}

function answer(t,b){

clearInterval(interval);

const bs=[...answers.children];

bs.forEach(x=>{

x.disabled=true;

if(x.innerHTML===ordre[i].c)
x.classList.add("correct");

});

if(t===ordre[i].c){

punts+=100+temps*5;

encerts++;

question.classList.add("pop");

setTimeout(()=>question.classList.remove("pop"),300);

}else{

b.classList.add("wrong");

}

setTimeout(()=>{

i++;

nextQ();

},1200);

}

function confetti(){

for(let i=0;i<120;i++){

const c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*100+"vw";

c.style.background=["red","gold","green","blue","orange"][Math.floor(Math.random()*5)];

c.style.animationDelay=Math.random()+"s";

document.body.appendChild(c);

}

}

function finish(){

quiz.style.display="none";

end.style.display="block";

let badge="🥉";

let titleText="Ciutadà Romà";

if(encerts===20){

badge="🏆";

titleText="Emperador de Roma";

confetti();

}
else if(encerts>=17){

badge="🥇";

titleText="Legionari d'Or";

confetti();

}
else if(encerts>=13){

badge="🥈";

titleText="Constructor d'Aqüeductes";

}
else if(encerts>=9){

badge="🥉";

titleText="Habitant de Roma";

}

badgeEl=document.getElementById("badge");

badgeEl.innerHTML=badge;

title.innerHTML=titleText;

finalScore.innerHTML=encerts+"/20 preguntes · "+punts+" punts";

summary.innerHTML="Has completat el Repte dels Romans!";

}

</script>

</body>
</html>
