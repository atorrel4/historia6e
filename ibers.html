<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repte dels Ibers</title>

<style>

*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#B76E3A,#E0B36A,#6E3B1F);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

#game{
width:95%;
max-width:900px;
background:white;
border-radius:25px;
padding:22px;
box-shadow:0 15px 35px rgba(0,0,0,.35);
}

h1{
text-align:center;
color:#7A3F12;
font-size:40px;
}

.small{text-align:center;color:#666;}

#top{
display:flex;
justify-content:space-between;
align-items:center;
font-size:22px;
font-weight:bold;
margin-bottom:10px;
}

#progress{
height:14px;
background:#eee;
border-radius:20px;
overflow:hidden;
margin:15px 0;
}

#bar{
height:100%;
width:0%;
background:#22c55e;
transition:.4s;
}

#circle{
width:65px;
height:65px;
border-radius:50%;
border:6px solid #D9A441;
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
font-weight:bold;
color:#7A3F12;
}

#img{
width:100%;
max-height:220px;
object-fit:cover;
border-radius:18px;
margin:12px 0;
}

button{
width:100%;
padding:16px;
margin:8px 0;
border:none;
border-radius:15px;
font-size:20px;
cursor:pointer;
background:#f3f4f6;
transition:.2s;
}

button:hover{
transform:scale(1.02);
background:#FFF3D8;
}

.correct{background:#22c55e;color:white;}
.wrong{background:#dc2626;color:white;}

#badge{font-size:80px;}

.menuBtn{
background:#7A3F12;
color:white;
}

.menuBtn:hover{
background:#5A2808;
}

.pop{
animation:pop .4s;
}

@keyframes pop{
0%{transform:scale(.8);}
60%{transform:scale(1.08);}
100%{transform:scale(1);}
}

.confetti{
position:fixed;
width:10px;
height:10px;
top:-20px;
animation:fall 3s linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
}
}

</style>

</head>

<body>

<div id="game">

<div id="start">

<h1>🛡️ Repte dels Ibers</h1>

<p class="small">
20 preguntes • Imatges • Cronòmetre • Puntuació
</p>

<button onclick="startGame()">🚀 Comencem!</button>

</div>

<div id="quiz" style="display:none;">

<div id="top">

<div id="score">⭐0</div>

<div id="circle">
<span id="timer">20</span>
</div>

</div>

<div id="progress">
<div id="bar"></div>
</div>

<img id="img" src="https://images.unsplash.com/photo-1519074069444-1ba4fff66d16?auto=format&fit=crop&w=900&q=80">

<h2 id="question"></h2>

<div id="answers"></div>

</div>

<div id="end" style="display:none;text-align:center;">

<div id="badge"></div>

<h1 id="title"></h1>

<h2 id="finalScore"></h2>

<p id="summary"></p>

<button onclick="location.reload()">🔁 Tornar a jugar</button>

<button class="menuBtn" onclick="window.location='index.html'">

🏺 Tornar al menú

</button>

</div>

</div>

<script>

const questions=[

{
q:"En quina zona de la Península vivien els ibers?",
c:"A la costa mediterrània",
w:["Al nord d'Europa","A les Canàries","Al desert"],
img:"https://images.unsplash.com/photo-1502920917128-1aa500764ce7?auto=format&fit=crop&w=900&q=80"
},

{
q:"On construïen molts poblats?",
c:"Dalt dels turons",
w:["A la platja","Dins dels rius","Al desert"],
img:"https://images.unsplash.com/photo-1473773508845-188df298d2d1?auto=format&fit=crop&w=900&q=80"
},

{
q:"Com protegien els poblats?",
c:"Amb muralles",
w:["Amb castells","Amb piràmides","Amb fossats"],
img:"https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=900&q=80"
},

{
q:"Quina forma tenien moltes cases?",
c:"Rectangular",
w:["Circular","Triangular","Rodona"],
img:"https://images.unsplash.com/photo-1524499982521-1ffd58dd89ea?auto=format&fit=crop&w=900&q=80"
},

{
q:"Quina activitat era molt important?",
c:"L'agricultura",
w:["La navegació","La impremta","La televisió"],
img:"https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=900&q=80"
},

{
q:"Quina escultura és molt famosa?",
c:"La Dama d'Elx",
w:["La Venus de Milo","El David","La Gioconda"],
img:"https://images.unsplash.com/photo-1549893074-4bc7f3e0b6e2?auto=format&fit=crop&w=900&q=80"
},

{
q:"Els ibers tenien escriptura pròpia?",
c:"Sí",
w:["No","Només dibuixos","Només números"],
img:"https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=900&q=80"
},

{
q:"Què utilitzaven per facilitar el comerç?",
c:"Monedes",
w:["Bitllets","Targetes","Petxines"],
img:"https://images.unsplash.com/photo-1518546305927-5a555bb7020d?auto=format&fit=crop&w=900&q=80"
},

{
q:"Qui protegia els poblats?",
c:"Els guerrers",
w:["Els pagesos","Els nens","Els sacerdots"],
img:"https://images.unsplash.com/photo-1517423440428-a5a00ad493e8?auto=format&fit=crop&w=900&q=80"
},

{
q:"Qui ocupava el lloc més alt de la societat?",
c:"Els caps i nobles",
w:["Els artesans","Els esclaus","Els comerciants"],
img:"https://images.unsplash.com/photo-1524492412937-b28074a5d7da?auto=format&fit=crop&w=900&q=80"
}

];

while(questions.length<20){
questions.push({...questions[questions.length%10]});
}

function shuffle(a){
a=[...a];
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

let ordre=shuffle(questions);

let i=0,punts=0,encerts=0,temps=20,interval;

function startGame(){
start.style.display="none";
quiz.style.display="block";
nextQ();
}

function nextQ(){

if(i>=ordre.length){
finish();
return;
}

bar.style.width=(i/20*100)+"%";

question.innerHTML=(i+1)+"/20 · "+ordre[i].q;

img.src=ordre[i].img;

score.innerHTML="⭐ "+punts;

temps=20;

timer.innerHTML=temps;

clearInterval(interval);

interval=setInterval(()=>{

temps--;

timer.innerHTML=temps;

if(temps<=0){
clearInterval(interval);
i++;
nextQ();
}

},1000);

answers.innerHTML="";

shuffle([ordre[i].c,...ordre[i].w]).forEach(t=>{

const b=document.createElement("button");

b.innerHTML=t;

b.onclick=()=>answer(t,b);

answers.appendChild(b);

});

}

function answer(t,b){

clearInterval(interval);

const bs=[...answers.children];

bs.forEach(x=>{

x.disabled=true;

if(x.innerHTML===ordre[i].c)
x.classList.add("correct");

});

if(t===ordre[i].c){

punts+=100+temps*5;

encerts++;

question.classList.add("pop");

setTimeout(()=>question.classList.remove("pop"),300);

}else{

b.classList.add("wrong");

}

setTimeout(()=>{

i++;

nextQ();

},1200);

}

function confetti(){

for(let i=0;i<120;i++){

const c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*100+"vw";

c.style.background=["red","gold","green","blue","orange"][Math.floor(Math.random()*5)];

c.style.animationDelay=Math.random()+"s";

document.body.appendChild(c);

}

}

function finish(){

quiz.style.display="none";

end.style.display="block";

let badge="⭐";

let titleText="Aprenent Iber";

if(encerts===20){
badge="🏆";
titleText="Gran Cap Iber";
confetti();
}
else if(encerts>=17){
badge="🥇";
titleText="Guerrer d'Or";
confetti();
}
else if(encerts>=13){
badge="🥈";
titleText="Habitant del Poblat";
}
else{
badge="🥉";
titleText="Explorador Iber";
}

badgeEl=document.getElementById("badge");

badgeEl.innerHTML=badge;

title.innerHTML=titleText;

finalScore.innerHTML=encerts+"/20 preguntes · "+punts+" punts";

summary.innerHTML="Has completat el Repte dels Ibers!";

}

</script>

</body>
</html>
